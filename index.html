# Aru-Sabu-Love-Story
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special Someone ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 85%;
        }

        h1 {
            color: #e91e63;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        .heart {
            font-size: 50px;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        .buttons {
            margin-top: 25px;
            position: relative;
            height: 60px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .yes-btn {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .no-btn {
            background-color: #f44336;
            color: white;
            position: absolute;
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
        }

        #success-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div class="heart">💖</div>
        <h1>তুমি কি আমার সারাজীবনের সঙ্গী হবে?</h1>
        <p>তোমার সাথে কাটানো প্রতিটা মুহূর্ত আমার জীবনের সবচেয়ে সুন্দর সময়। আমি চাই আমাদের এই গল্পটা সারাজীবনের জন্য স্থায়ী হোক! 🥰</p>
        
        <div class="buttons">
            <button class="btn yes-btn" onclick="sayYes()">হ্যাঁ! ❤️</button>
            <button class="btn no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">না 😜</button>
        </div>
    </div>

    <div class="container" id="success-message">
        <div class="heart">🎉👩‍❤️‍👨💍</div>
        <h1>ইয়েএএএ! ❤️</h1>
        <p>আমি জানতাম তুমি 'হ্যাঁ' বলবে! লাভ ইউ সো মাচ! 💖✨</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
        }
    </script>
</body>
</html>
