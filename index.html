<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 3 Months Anniversary! ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            to { transform: scale(1.15); }
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #ffe0ec;
            color: #d81b60;
            border: 2px solid #ff80ab;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: #ff4081;
            color: white;
            border-color: #ff4081;
            transform: translateY(-2px);
        }

        #anniversary-card {
            display: none;
        }

        .anniversary-title {
            font-size: 28px;
            color: #e91e63;
            margin-bottom: 15px;
        }

        .anniversary-text {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
        }

        .hearts-bg {
            font-size: 40px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- ১ম কার্ড: প্রশ্ন -->
    <div class="card" id="question-card">
        <div class="icon">🤔💭</div>
        <h1>আমাদের আজকে কি তা কি তোমার জানা আছে?🤔</h1>
        <div class="btn-group">
            <button class="option-btn" onclick="revealAnniversary()">হ্যাঁ, খুব ভালো করেই জানি! 🥰</button>
            <button class="option-btn" onclick="revealAnniversary()">উম্মম... একটু ভুলে গেছি 😜</button>
            <button class="option-btn" onclick="revealAnniversary()">তুমিই বলে দাও! ❤️</button>
        </div>
    </div>

    <!-- ২য় কার্ড: উত্তর/অ্যানিভার্সারি শুভেচ্ছা -->
    <div class="card" id="anniversary-card">
        <div class="icon">🎉👩‍❤️‍👨✨</div>
        <h1 class="anniversary-title">হ্যাপি ৩ মাসের অ্যানিভার্সারি! 🤗❤️</h1>
        <p class="anniversary-text">
            আজকে আমাদের বিয়ের ৩ মাস পূর্ণ হলো! 💖<br>
            প্রতিটা মুহূর্ত তোমার সাথে কাটাতে পেরে আমি সত্যি অনেক ভাগ্যবান। এভাবেই সারাজীবন একসাথে পাশে থেকো! 🥰✨
        </p>
        <div class="hearts-bg">💖🌸💍🌹🥂</div>
    </div>

    <script>
        function revealAnniversary() {
            document.getElementById('question-card').style.display = 'none';
            document.getElementById('anniversary-card').style.display = 'block';
        }
    </script>

</body>
</html>
